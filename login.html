<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - English ASAP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0a0f1a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #msg { margin-top: 15px; font-size: 0.9rem; color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Entrar no Curso</h2>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="password" placeholder="Senha">
        <button id="btn" onclick="executarLogin()">Entrar</button>
        <p id="msg"></p>
    </div>

    <script>
        const supabaseUrl = 'https://rnmpqknafnoipjszcwta.supabase.co';
        const supabaseKey = 'sb_publishable_zsGIwdGxiTkHNDQ7S1l_9w_uP5a5gy2';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function executarLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            
            // TESTE VISUAL IMEDIATO
            msg.style.color = "yellow";
            msg.innerText = "Conectando ao Supabase..."; 

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    msg.style.color = "#f87171";
                    msg.innerText = "Erro: " + error.message;
                } else {
                    msg.style.color = "#4ade80";
                    msg.innerText = "Sucesso! Entrando...";
                    window.location.href = "index.html";
                }
            } catch (err) {
                msg.innerText = "Erro de conexão fatal.";
            }
        }
    </script>
</body>
</html>
